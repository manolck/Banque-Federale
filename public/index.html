<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Banque Fédérale</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0905; --panel:#17100a; --panel2:#20150d; --ink:#f5e4b8;
  --muted:#b69b68; --gold:#c9943c; --gold2:#f3d58a; --line:#62451f;
  --blue:#4d8fbd; --green:#3f9b67; --red:#b94735; --black:#070503;
}
body{
  font-family: Georgia,"Times New Roman",serif;
  background:
    radial-gradient(circle at top,#28190e 0%,#100a06 38%,#070503 100%);
  color:var(--ink);
}
input,select,textarea,button{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3142;border-radius:99px}
h1,h2,h3{letter-spacing:.02em;text-shadow:0 2px 0 #000}
button{transition:.15s ease}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.bvh-sidebar{
  width:255px;background:linear-gradient(180deg,#1b1108,#0d0905);
  border-right:1px solid var(--line);padding:18px 18px 20px;display:flex;flex-direction:column;
  box-shadow:8px 0 28px #0008;position:relative;
}
.bvh-sidebar:after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:#d09c4a55}
.bvh-brand{text-align:center;padding:8px 0 18px;margin-bottom:18px;border-bottom:1px solid #6d4b2266}
.bvh-brand img{width:128px;max-width:90%;height:auto;display:block;margin:0 auto 12px;filter:drop-shadow(0 8px 16px #000)}
.bvh-brand-title{font-size:27px;line-height:1.02;font-weight:900;color:#f6d27b;text-transform:uppercase;letter-spacing:.045em}
.bvh-brand-date{margin-top:8px;color:#d9b66c;font-size:13px;letter-spacing:.22em;text-transform:uppercase}
.bvh-main{flex:1;padding:26px 34px;overflow:auto;background:linear-gradient(180deg,#130d08aa,#090603aa)}
.bvh-nav{display:grid;gap:9px;flex:1;align-content:start}
.bvh-user{margin-top:auto}
.bvh-nav button{
  border:1px solid #4a321966;border-radius:9px;padding:13px 14px;text-align:left;
  font-weight:800;cursor:pointer;color:#cfb57b;background:#120b06;
  box-shadow:inset 0 0 0 1px #0008;
}
.bvh-nav button.active{
  color:#ffe19b;background:linear-gradient(90deg,#4a3216,#2a1a0c);
  border-color:#9f7431;box-shadow:0 0 18px #c9943c22,inset 0 0 0 1px #e0b45a33;
}
.bvh-user{border-top:1px solid #6d4b2266;padding-top:16px;color:#f1d99a}
.bvh-topbar{
  border:1px solid #6d4b22;border-radius:12px;margin-bottom:22px;padding:16px 20px;
  background:linear-gradient(90deg,#25170c,#191007);display:flex;justify-content:space-between;gap:16px;align-items:center;
  box-shadow:inset 0 0 0 1px #000,0 8px 24px #0005;
}
.bvh-topbar small{display:block;color:#c9a567;letter-spacing:.13em;text-transform:uppercase}
.bvh-card{
  background:linear-gradient(180deg,#1d130b,#130c07);border:1px solid #6d4b22;border-radius:14px;
  padding:18px;box-shadow:inset 0 0 0 1px #000,0 12px 28px #0005;position:relative;overflow:hidden;
}
.bvh-card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--gold),transparent)}
.bvh-card .icon{font-size:27px;margin-bottom:7px}
.bvh-card p{color:#c6aa72;font-size:14px}
.bvh-card h2{font-size:30px;color:#f4c86d;margin-top:4px}
.bvh-grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.bvh-grid-2{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}
.bvh-ledger{width:100%;background:linear-gradient(180deg,#1b1109,#100a06);border:1px solid #6d4b22;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px #000}
.bvh-ledger-title{padding:14px 16px;border-bottom:1px solid #6d4b2266;color:#f0ce80;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.bvh-row{display:grid;grid-template-columns:1.4fr 110px 110px 110px 155px;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid #3b281366}
.bvh-row:first-of-type{border-top:none}
.bvh-statement{display:grid;grid-template-columns:108px minmax(168px,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(72px,.7fr);gap:10px;align-items:center;padding:12px 16px;border-top:1px solid #3b281366;color:#d8bf82;font-variant-numeric:tabular-nums}
.bvh-statement-head{border-top:none;color:#c9a567;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.bvh-statement b{color:#f4d58a}
.bvh-statement span:nth-child(n+2),.bvh-statement-head span:nth-child(n+2){text-align:right}
.bvh-statement .gain{color:#9ddeaf;font-weight:800}
.bvh-statement .loss{color:#ffb0a6;font-weight:800}
.bvh-statement .flat{color:#d8bf82}
.bvh-statement .deposit{color:#f4d58a;font-weight:800;white-space:nowrap}
.bvh-statement .withdrawal{color:#f0a35a;font-weight:800;white-space:nowrap}
.bvh-market{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px}
.bvh-market article{border:1px solid #3b281366;border-radius:10px;padding:12px 14px;background:#140c06}
.bvh-market b{display:block;color:#f4d58a;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.bvh-market strong{display:block;margin:6px 0 2px;font-size:22px;font-variant-numeric:tabular-nums}
.bvh-market span{display:block;color:#c9a567;font-size:13px}
.bvh-market .gain{color:#9ddeaf}
.bvh-market .loss{color:#ffb0a6}
.bvh-market .flat{color:#d8bf82}
.bvh-empty{padding:28px;text-align:center;color:#d7bc7b}
.bvh-activity{padding:12px 16px;border-top:1px solid #3b281366;color:#d8bf82}
.bvh-activity b{color:#f4d58b}
.bvh-login-logo{width:185px;max-width:90%;display:block;margin:0 auto 14px;filter:drop-shadow(0 8px 16px #000)}
.bvh-login-card{background:linear-gradient(180deg,#1e140b,#100a06);border:1px solid #805a28;border-top:4px solid #c9943c;border-radius:18px;padding:34px;width:420px;box-shadow:0 32px 90px #000}

.bvh-client-list{display:grid;gap:10px;margin-top:16px}
.bvh-client-row{display:grid;grid-template-columns:150px 1.5fr 120px 140px 150px;gap:12px;align-items:center;background:linear-gradient(180deg,#1b1109,#100a06);border:1px solid #6d4b22;border-radius:10px;padding:13px 15px;box-shadow:inset 0 0 0 1px #000;cursor:pointer}
.bvh-client-row:hover{border-color:#c9943c;box-shadow:0 0 18px #c9943c22,inset 0 0 0 1px #000}
.bvh-dossier-head{border:1px solid #7b5528;border-radius:14px;padding:18px 20px;background:linear-gradient(90deg,#28190d,#140c06);display:flex;justify-content:space-between;gap:16px;margin-bottom:16px}
.bvh-dossier-code{color:#f3d58a;letter-spacing:.12em;text-transform:uppercase;font-size:13px}
.bvh-dossier-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.bvh-field{display:grid;grid-template-columns:150px 1fr;padding:9px 0;border-bottom:1px solid #3b281366;color:#d8bf82}
.bvh-field b{color:#f4d58b}
.bvh-form-part{margin:18px 0 8px;padding:16px 16px 18px;background:#120e09;border:1px solid #3b281366;border-radius:12px}
.bvh-form-part h3{margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid #6d4b2244;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#e2c27a}
.bvh-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;align-items:end}
.bvh-form-span{grid-column:1 / -1}
.bvh-form-plain{display:grid;gap:10px}
@media(max-width:760px){.bvh-form-grid{grid-template-columns:1fr}.bvh-form-span{grid-column:auto}}
.bvh-note-box{min-height:140px;border:1px dashed #7b5528;border-radius:10px;padding:14px;color:#b69b68;background:#100a06}

.bvh-doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:16px}
.bvh-doc-card{border:1px solid #65451f;border-radius:12px;background:linear-gradient(180deg,#21160d,#120b06);padding:12px;display:flex;gap:12px;align-items:center;min-height:92px;box-shadow:inset 0 0 0 1px #0007}
.bvh-doc-thumb{width:62px;height:62px;border-radius:8px;object-fit:cover;border:1px solid #7b5528;background:#0b0704;display:flex;align-items:center;justify-content:center;font-size:28px;color:#f3d58a;flex:0 0 auto}
.bvh-doc-meta{min-width:0;flex:1;color:#d8bf82;font-size:13px}
.bvh-doc-meta b{display:block;color:#f4d58b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.bvh-doc-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bvh-upload-line{padding:14px 16px;border-top:1px solid #4a321966;display:grid;grid-template-columns:160px 1fr auto;gap:10px;align-items:end}
.bvh-dossier-grid-wide{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:1100px){.bvh-upload-line{grid-template-columns:1fr}.bvh-dossier-grid-wide{grid-template-columns:1fr}}

@media(max-width:900px){.bvh-client-row{grid-template-columns:1fr}.bvh-dossier-grid{grid-template-columns:1fr}}

@media(max-width:1100px){.bvh-grid-4{grid-template-columns:repeat(2,1fr)}.bvh-grid-2{grid-template-columns:1fr}.bvh-sidebar{width:230px}}

.bvh-note-input{width:100%;background:#120b06;border:1px solid #62451f;border-radius:8px;color:#f8e7b7;padding:12px;font-family:Georgia,serif;font-size:15px;outline:none}
.bvh-note-card{background:linear-gradient(180deg,#f3dfad,#d8b66f);color:#1b1008;border:1px solid #8b642c;border-radius:8px;padding:12px;box-shadow:inset 0 0 18px #5b351033}
.bvh-note-card small{color:#5b3510;font-weight:800}


/* ===== Adaptation téléphone et tablette ===== */
.bvh-mobile-top,.bvh-menu-backdrop{display:none}
.bvh-shell{display:flex;min-height:100vh}

@media (max-width:1100px) and (min-width:761px){
  .bvh-sidebar{width:214px;padding-left:14px;padding-right:14px}
  .bvh-main{padding:22px}
  .bvh-grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bvh-grid-2,.bvh-dossier-grid-wide{grid-template-columns:1fr}
}

@media (max-width:760px){
  html,body,#root{min-height:100%;overflow-x:hidden}
  body{font-size:16px}
  .bvh-shell{display:block;min-height:100dvh}
  .bvh-mobile-top{
    display:flex;position:fixed;z-index:250;left:0;right:0;top:0;height:60px;
    align-items:center;gap:11px;padding:8px 12px;
    background:linear-gradient(90deg,#1d120a,#0d0905);border-bottom:1px solid #6d4b22;
    box-shadow:0 6px 18px #0009;
  }
  .bvh-mobile-menu-button{
    width:42px;height:42px;border-radius:9px;border:1px solid #8b642c;
    background:linear-gradient(180deg,#5c3d1c,#2e1b0d);color:#ffe0a0;font-size:21px;cursor:pointer;
  }
  .bvh-mobile-title{min-width:0;line-height:1.05}
  .bvh-mobile-title b{display:block;color:#f6d27b;font-size:16px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bvh-mobile-title span{display:block;color:#c5a261;font-size:10px;text-transform:uppercase;letter-spacing:.16em;margin-top:3px}
  .bvh-menu-backdrop{position:fixed;z-index:240;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .2s ease}
  .bvh-menu-backdrop.open{display:block;opacity:1;pointer-events:auto}
  .bvh-sidebar{
    position:fixed;z-index:260;top:0;left:0;bottom:0;height:100dvh;width:min(84vw,310px);
    transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto;
    padding-top:13px;box-shadow:14px 0 35px #000c;
  }
  .bvh-sidebar.open{transform:translateX(0)}
  .bvh-brand{padding-top:8px;margin-bottom:12px}
  .bvh-brand img{width:155px;max-width:74%;margin-bottom:8px}
  .bvh-brand-title{font-size:24px}
  .bvh-nav{flex:none}
  .bvh-nav button{min-height:48px;font-size:16px}
  .bvh-user{margin-top:16px}
  .bvh-main{width:100%;min-height:100dvh;padding:76px 12px 20px;overflow:visible}
  .bvh-topbar{flex-direction:column;align-items:flex-start;padding:14px;margin-bottom:14px;gap:9px}
  .bvh-topbar h1{font-size:29px;line-height:1.05}
  .bvh-topbar>div:last-child{text-align:left!important}
  .bvh-grid-4,.bvh-grid-2,.bvh-dossier-grid,.bvh-dossier-grid-wide{grid-template-columns:1fr;gap:12px}
  .bvh-card{padding:15px}
  .bvh-card h2{font-size:29px}
  .bvh-client-row{grid-template-columns:1fr 1fr;gap:7px;padding:13px}
  .bvh-client-row>:first-child{grid-column:1/-1}
  .bvh-client-row>:last-child{grid-column:1/-1}
  .bvh-dossier-head{flex-direction:column;padding:15px;gap:12px}
  .bvh-dossier-head h1{font-size:30px;line-height:1.03}
  .bvh-dossier-head>div:last-child{width:100%;display:grid!important;grid-template-columns:1fr 1fr;gap:8px!important}
  .bvh-dossier-head>div:last-child button{width:100%}
  .bvh-field{grid-template-columns:1fr;gap:4px;padding:11px 0}
  .bvh-upload-line{grid-template-columns:1fr;gap:10px;padding:14px}
  .bvh-doc-grid{grid-template-columns:1fr;padding:12px}
  .bvh-doc-card{min-height:82px}
  .bvh-row{display:flex;flex-wrap:wrap;gap:7px;padding:13px 14px}
  .bvh-row>*{min-width:0}
  .bvh-row>b{flex:1 1 52%;font-size:16px}
  .bvh-row>span{flex:1 1 38%}
  .bvh-row>button,.bvh-row>a{flex:1 1 100%;justify-content:center;text-align:center}
  .bvh-market{grid-template-columns:1fr}
  .bvh-statement{grid-template-columns:1fr 1fr;gap:8px 14px;padding:14px}
  .bvh-statement-head{display:none}
  .bvh-statement span,.bvh-statement b,.bvh-statement span:nth-child(n+2){text-align:left}
  .bvh-statement:not(.bvh-statement-head)>*::before{content:attr(data-label);display:block;margin-bottom:2px;color:#c9a567;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .bvh-ledger-title{padding:13px 14px}
  .bvh-note-box{min-height:110px}
  .bvh-login-card{width:100%;max-width:420px;padding:26px 20px}
  .bvh-login-logo{width:155px}
  input,select,textarea{font-size:16px!important}
  button{min-height:40px}
}

.bvh-agenda-event{min-height:36px}
@media(max-width:760px){
  .bvh-agenda-modal-grid{grid-template-columns:1fr!important}
}


/* ===== Agenda hebdomadaire — présentation calendrier visuel ===== */
.bvh-calendar-panel{background:#100a06;border:1px solid #6d4b22;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px #000,0 12px 28px #0005}
.bvh-calendar-toolbar{padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #6d4b2266;background:linear-gradient(90deg,#24170c,#140d08)}
.bvh-calendar-title{font-weight:900;color:#f3d58a;font-size:18px;margin-right:auto;white-space:nowrap}
.bvh-view-toggle{display:flex;border:1px solid #765326;border-radius:9px;overflow:hidden;background:#120b06}
.bvh-view-toggle button{border:0;border-radius:0;background:transparent;color:#d8bc78;padding:8px 12px;cursor:pointer;font-weight:800}
.bvh-view-toggle button.active{background:#8b642c;color:#fff}
.bvh-calendar-filter{min-width:190px;flex:1 1 210px}
.bvh-calendar-scroll{overflow:auto;max-height:calc(100vh - 220px);background:#0f0a06}
.bvh-week-grid{min-width:1050px;display:grid;grid-template-columns:72px repeat(var(--days),minmax(130px,1fr));position:relative}
.bvh-calendar-corner{position:sticky;top:0;z-index:50;background:#1c1109;border-right:1px solid #503719;border-bottom:1px solid #765326;min-height:60px}
.bvh-calendar-day-head{position:sticky;top:0;z-index:45;padding:10px 8px;text-align:center;background:linear-gradient(180deg,#25170c,#191007);border-right:1px solid #503719;border-bottom:1px solid #765326;color:#d8bc78;cursor:pointer}
.bvh-calendar-day-head:hover{background:#2d1c0e}
.bvh-calendar-day-head .dow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#b69b68}
.bvh-calendar-day-head .date{display:inline-flex;align-items:center;justify-content:center;margin-top:4px;min-width:30px;height:30px;border-radius:50%;font-weight:900;color:#f5e4b8}
.bvh-calendar-day-head.today .date{background:#c9943c;color:#1b1008}
.bvh-calendar-time-label{height:34px;padding:4px 9px;text-align:right;color:#b69b68;font-size:12px;border-right:1px solid #503719;border-bottom:1px solid #2e1f1066;background:#130c07}
.bvh-calendar-day-column{position:relative;height:1632px;border-right:1px solid #503719;background:#100a06}
.bvh-calendar-slot{height:34px;border-bottom:1px solid #2e1f1066;cursor:pointer}
.bvh-calendar-slot:nth-child(2n+1){border-bottom-color:#4f351a88}
.bvh-calendar-slot:hover{background:#c9943c12}
.bvh-calendar-now{position:absolute;z-index:30;left:0;right:0;height:2px;background:#e24736;pointer-events:none;box-shadow:0 0 0 1px #0005}
.bvh-calendar-now:before{content:"";position:absolute;left:-4px;top:-4px;width:9px;height:9px;border-radius:50%;background:#e24736}
.bvh-agenda-event{position:absolute;z-index:20;border:0;border-left:4px solid #f3d58a;border-radius:7px;padding:6px 7px;text-align:left;overflow:hidden;cursor:pointer;box-shadow:0 3px 8px #0007;transition:filter .15s ease,box-shadow .15s ease;min-height:28px}
.bvh-agenda-event:hover{transform:none;filter:brightness(1.08);box-shadow:0 6px 14px #000b;z-index:35}
.bvh-agenda-event .event-time{font-size:11px;font-weight:900;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bvh-agenda-event .event-client{font-size:12px;font-weight:900;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bvh-agenda-event .event-meta{display:block;font-size:10px;opacity:.86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.bvh-agenda-event.annule{opacity:.55;text-decoration:line-through;border-style:dashed}
.bvh-agenda-legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #6d4b2266;background:#160e08;color:#c8a96f;font-size:12px}
.bvh-agenda-legend span{display:inline-flex;align-items:center;gap:5px}
.bvh-agenda-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.bvh-agenda-empty{color:#9d7e49;text-align:center;padding:14px 16px;background:#130c07;border-bottom:1px solid #3b281366}
.bvh-agenda-conflict{margin-top:2px;padding:10px 12px;border-radius:8px;border:1px solid #9f7431;background:#5c3d1c33;color:#f3d58a;font-size:13px}
@media(max-width:760px){
  .bvh-calendar-toolbar{padding:12px}
  .bvh-calendar-title{width:100%;font-size:16px}
  .bvh-calendar-filter{min-width:100%;flex-basis:100%}
  .bvh-calendar-scroll{max-height:none}
  .bvh-week-grid{min-width:650px}
  .bvh-calendar-day-column{height:1632px}
  .bvh-agenda-event{font-size:11px}
}


/* ===== Tableau de bord — rendez-vous du jour ===== */
.bvh-today-agenda-row{
  display:grid;grid-template-columns:112px minmax(190px,1.45fr) minmax(170px,1fr) auto;
  gap:12px;align-items:center;padding:12px 16px;border-top:1px solid #3b281366;
  background:linear-gradient(90deg,#160e08,#100a06);
}

  if(!prenom||!nom) return {client:null, created:false};

  if(id && ids.includes(id)) return true;

  if(!full) return false;

function LoanDetail({loan,onBack,onUpdate,onDelete,notify,me}){
  const[reminderTarget,setReminderTarget]=useState(null);
  const[recoveryStatus,setRecoveryStatus]=useState(loan.recouvrement_status||'aucun');
  const[recoveryNotes,setRecoveryNotes]=useState(loan.recouvrement_notes||'');
  useEffect(()=>{setRecoveryStatus(loan.recouvrement_status||'aucun');setRecoveryNotes(loan.recouvrement_notes||'');},[loan.id,loan.recouvrement_status,loan.recouvrement_notes]);
  const paid=(loan.echeances||[]).filter(e=>e.statut==='paye').reduce((s,e)=>s+Number(e.montant||0),0);
  async function mark(i,val){
    const es=[...(loan.echeances||[])];
    es[i]={...es[i],statut:val?'paye':'attente'};
    const allPaid=es.length>0&&es.every(e=>e.statut==='paye');
    const patch={id:loan.id,echeances:es};
    if(allPaid)patch.recouvrement_status='cloture';
    else if((loan.recouvrement_status||'')==='cloture')patch.recouvrement_status='aucun';
    try{
      const u=await api.updateLoan(patch);
      onUpdate(u);
      notify(allPaid?'Paiement validé · prêt clôturé automatiquement':val?'Paiement validé':'Paiement annulé');
    }catch(e){notify('⚠ '+e.message)}
  }
  async function saveRecovery(status=recoveryStatus){
    try{
      const active=status&&status!=='aucun'&&status!=='cloture';
      const patch={id:loan.id,recouvrement_status:status,recouvrement_notes:recoveryNotes,recouvrement_started_at:active?(loan.recouvrement_started_at||new Date().toISOString()):(loan.recouvrement_started_at||null)};
      const u=await api.updateLoan(patch);
      onUpdate(u);
      notify(status==='aucun'?'Suivi de recouvrement retiré':'Suivi de recouvrement enregistré');
    }catch(e){notify('⚠ '+e.message)}
  }
  function savedReminder(updatedLoan){onUpdate(updatedLoan);notify('Rappel enregistré dans le registre');}
  const history=(loan.echeances||[]).flatMap((e,i)=>remindersForEcheance(e).map(r=>({...r,echeance_index:i}))).sort((a,b)=>reminderDateTime(b)-reminderDateTime(a)||new Date(b.created_at||0)-new Date(a.created_at||0));
  const remaining=Math.max(Number(loan.total_a_rembourser||0)-paid,0);

    <button onClick={onBack} style={{background:'none',border:'none',color:C.blue,cursor:'pointer',marginBottom:16}}>← Retour</button>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,gap:12,flexWrap:'wrap'}}><div><h1>{loan.prenom} {loan.nom}</h1><div className="bvh-mini-badges"><AgencyBadge agence={loanAgence(loan)}/>{isLoanInRecouvrement(loan)&&<span className="bvh-mini-badge recouvrement">⚖️ {recouvrementLabel(loan.recouvrement_status)}</span>}</div></div><code style={{background:C.bord,padding:'5px 10px',borderRadius:6,color:C.blue}}>{loan.loan_id}</code></div>
    <div className="bvh-loan-detail-summary"><div><p>📱 {loan.telegram||'—'}</p><p>🏦 {loan.banquier_username||'—'}</p><p>Agence : <b>{agenceLabel(loan.agence)}</b></p><p>Garanties : {loan.garanties||'—'}</p></div><div><p>Somme : <b>{fCur(loan.somme)}</b></p><p>Total : <b>{fCur(loan.total_a_rembourser)}</b></p><p>Payé : <b style={{color:C.green}}>{fCur(paid)}</b></p><p>Restant : <b style={{color:C.gold}}>{fCur(remaining)}</b></p></div></div>
    <div className="bvh-recovery-panel"><div className="bvh-recovery-head"><b>Suivi de recouvrement</b><RecoveryBadge status={recoveryStatus}/></div><div className="bvh-recovery-grid"><div><Select label="Statut" value={recoveryStatus} onChange={e=>setRecoveryStatus(e.target.value)}>{Object.entries(RECOUVREMENT_STATES).map(([k,v])=><option key={k} value={k}>{v[0]}</option>)}</Select>{loan.recouvrement_started_at&&<p className="bvh-recovery-note">Ouvert le {stamp1904(loan.recouvrement_started_at)}</p>}</div><Txt label="Notes de recouvrement" value={recoveryNotes} onChange={e=>setRecoveryNotes(e.target.value)} placeholder="Relances, mise en demeure, saisie prévue, garantie concernée…"/><Btn color={recouvrementColor(recoveryStatus)} onClick={()=>saveRecovery(recoveryStatus)}>Enregistrer le suivi</Btn></div></div>
    <div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap'}}><Btn onClick={()=>onUpdate({...loan,_edit:true})}>Modifier le prêt</Btn><Btn color="#8b642c" onClick={()=>{setRecoveryStatus('recouvrement_actif');setTimeout(()=>saveRecovery('recouvrement_actif'),0)}}>Passer en recouvrement</Btn><Btn color={C.red} onClick={()=>onDelete(loan)}>Supprimer le prêt</Btn></div>
    <div className="bvh-ledger"><div className="bvh-ledger-title">Échéances et rappels</div>
      {(loan.echeances||[]).map((e,i)=>{const last=latestReminder(e);return <div className="bvh-reminder-row" key={i}>
        <span className="bvh-reminder-number">#{i+1}</span><b>{fCur(e.montant)}</b><span>{fDate(e.date)}</span><Badge s={st(e)}/>
        <div className="bvh-reminder-latest">{e.statut==='paye'?<span className="bvh-reminder-paid">Échéance remboursée</span>:<><b>{last?reminderSummary(last):'Aucun rappel envoyé'}</b>{last&&<small>Noté dans le registre le {stamp1904(last.created_at)} · {reminderMethodLabel(last.reminder_method)}</small>}</>}</div>
        {e.statut==='paye'?<Btn color="#555" onClick={()=>mark(i,false)}>Annuler paiement</Btn>:<div className="bvh-reminder-actions"><Btn color="#8b642c" onClick={()=>setReminderTarget(i)}>{last?'Ajouter un rappel':'Noter un rappel'}</Btn><Btn color={C.green} onClick={()=>mark(i,true)}>Valider paiement</Btn></div>}
      </div>})}
    </div>
    <div className="bvh-ledger" style={{marginTop:14}}><div className="bvh-ledger-title">Historique des rappels</div>
      {history.length===0?<p className="bvh-empty">Aucun rappel d’échéance n’a encore été noté pour ce prêt.</p>:history.map((r,index)=><div className="bvh-reminder-history" key={`${r.created_at||'rappel'}-${index}`}><div><b>Échéance n°{Number(r.echeance_index)+1}</b><span>{fDate(r.reminder_date)}{r.reminder_time?` à ${String(r.reminder_time).slice(0,5)}`:''} · {reminderMethodLabel(r.reminder_method)}</span></div><div><b>{r.recorded_by_username||'—'}</b><small>Noté le {stamp1904(r.created_at)}</small></div>{r.note&&<p>{String(r.note).replace(/\b(20\d{2})(?=-\d{2}-\d{2}\b)/g,(_,year)=>String(rpYear(year)))}</p>}</div>)}
    </div>
    <ReminderModal open={reminderTarget!==null} loan={loan} echeanceIndex={reminderTarget} echeance={reminderTarget!==null?(loan.echeances||[])[reminderTarget]:null} onClose={()=>setReminderTarget(null)} onSaved={savedReminder} me={me}/>
  </div>
}

function LoansPage({loans,clients,setLoans,notify,onLoanDraftChange,openForClient,onQuickLoanHandled,openLoanId,onOpenLoanHandled,me,activeAgence='toutes',onActiveAgenceChange}){
  const[modal,setModal]=useState(false),[sel,setSel]=useState(null),[category,setCategory]=useState('tous'),[query,setQuery]=useState(''),[agency,setAgency]=useState(activeAgence||'toutes');
  useEffect(()=>{setAgency(activeAgence||'toutes')},[activeAgence]);
  useEffect(()=>{if(sel && !sel._edit){const live=loans.find(x=>String(x.id)===String(sel.id));if(live && live!==sel)setSel(live);}},[loans,sel]);
  useEffect(()=>{if(!openLoanId)return;const target=loans.find(x=>String(x.id)===String(openLoanId));if(target){setSel(target);onOpenLoanHandled?.();}},[openLoanId,loans]);
  useEffect(()=>()=>onLoanDraftChange?.(false),[]);
  useEffect(()=>{if(openForClient){onLoanDraftChange?.(true);setModal(true)}},[openForClient]);

  function unpaid(l){return [...(l.echeances||[])].filter(e=>e.statut!=='paye').sort((a,b)=>rpIso(a.date).localeCompare(rpIso(b.date)));}
  function loanCategory(l){
    if(isNeverReimbursed(l))return 'jamais_rembourse';
    if(isLoanRecouvrementCloture(l))return 'rembourses';
    if(isLoanInRecouvrement(l))return 'recouvrement';
    const open=unpaid(l);
    if(open.length===0)return 'rembourses';
    if(open.some(e=>st(e)==='retard'))return 'retard';
    return st(open[0])==='aujourdhui'?'aujourdhui':'avenir';
  }
  function nextDue(l){return unpaid(l)[0]||null;}
  function paidAmount(l){return (l.echeances||[]).filter(e=>e.statut==='paye').reduce((sum,e)=>sum+Number(e.montant||0),0);}
  function sortLoans(a,b){
    const aClosed=isLoanRecouvrementCloture(a),bClosed=isLoanRecouvrementCloture(b);
    if(aClosed!==bClosed)return aClosed?1:-1;
    const order={recouvrement:0,retard:1,aujourdhui:2,avenir:3,rembourses:4,jamais_rembourse:5};
    const aCat=loanCategory(a),bCat=loanCategory(b);
    if(order[aCat]!==order[bCat])return order[aCat]-order[bCat];
    if(aCat==='rembourses'||(aClosed&&bClosed)){
      const aLast=[...(a.echeances||[])].map(e=>e.date||'').sort().pop()||'';
      const bLast=[...(b.echeances||[])].map(e=>e.date||'').sort().pop()||'';
      return bLast.localeCompare(aLast);
    }
    return rpIso(nextDue(a)?.date||'9999-12-31').localeCompare(rpIso(nextDue(b)?.date||'9999-12-31'));
  }

  const allLoans=[...(loans||[])].sort(sortLoans);
  const agencyLoans=allLoans.filter(l=>agency==='toutes'||loanAgence(l)===agency);
  const counts={
    tous:agencyLoans.length,
    recouvrement:agencyLoans.filter(l=>loanCategory(l)==='recouvrement').length,
    retard:agencyLoans.filter(l=>loanCategory(l)==='retard').length,
    aujourdhui:agencyLoans.filter(l=>loanCategory(l)==='aujourdhui').length,
    avenir:agencyLoans.filter(l=>loanCategory(l)==='avenir').length,
    rembourses:agencyLoans.filter(l=>loanCategory(l)==='rembourses').length,
    jamais_rembourse:agencyLoans.filter(l=>loanCategory(l)==='jamais_rembourse').length
  };
  const categories=[['tous','Tous'],['recouvrement','Recouvrement'],['retard','Retards'],['aujourdhui',"Aujourd’hui"],['avenir','À venir'],['rembourses','Clôturés'],['jamais_rembourse','Jamais remboursés']];
  const visibleLoans=agencyLoans
    .filter(l=>category==='tous'||loanCategory(l)===category)
    .filter(l=>`${l.prenom||''} ${l.nom||''} ${l.telegram||''} ${l.loan_id||''} ${agenceLabel(loanAgence(l))} ${recouvrementLabel(l.recouvrement_status)}`.toLowerCase().includes(query.toLowerCase()));

  async function save(l){try{const u=l.id?await api.updateLoan(l):await api.addLoan(l);setLoans(l.id?loans.map(x=>x.id===u.id?u:x):[u,...loans]);notify(l.id?'Prêt modifié':'Prêt créé')}catch(e){notify('⚠ '+e.message)}}

const AGENDA_TIMES=Array.from({length:48},(_,i)=>`${String(Math.floor(i/2)).padStart(2,'0')}:${i%2?'30':'00'}`);

function agendaToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function agendaRealIso(value){const iso=String(value||'').slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!iso)return '';const year=Number(iso[1]);return `${year>=2000?year:year+(2026-1904)}-${iso[2]}-${iso[3]}`;}
function agendaDateTime(date,time){const real=agendaRealIso(date)||String(date||'').slice(0,10);return new Date(`${real}T${time||'00:00'}:00`);}
function agendaEndDate(date,start,end){const real=agendaRealIso(date)||date;return end<=start?plusDaysFrom(real,1):real;}
function plusDaysFrom(iso,days){const d=new Date(`${iso}T12:00:00`);d.setDate(d.getDate()+days);return d.toISOString().split('T')[0];}
function agendaEventsForClient(client,events){
  return (events||[]).filter(e=>String(e.client_id||'')===String(client.id||''));
}
function AgendaStatus({status}){const s=AGENDA_STATUSES[status]||AGENDA_STATUSES.prevu;return <span style={{display:'inline-block',background:s[1],color:'#fff',padding:'3px 9px',borderRadius:20,fontSize:12,fontWeight:800}}>{s[0]}</span>}

const AGENDA_SLOT_HEIGHT=34;
const AGENDA_COLORS={
  etude_pret:'#3f6f9f',
  signature:'#7a5a9e',
  remboursement:'#3f8f67',
  immobilier:'#9b6531',
  consultation:'#53788c',
  autre:'#776348'
};
function timeFromDate(d){return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function isoFromDate(d){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10);}
function mondayOf(iso){
  const d=new Date(`${iso}T12:00:00`);
  const shift=(d.getDay()+6)%7;
  d.setDate(d.getDate()-shift);
  return isoFromDate(d);
}
function weekDaysFrom(iso){const monday=mondayOf(iso);return Array.from({length:7},(_,i)=>plusDaysFrom(monday,i));}
function dateLong(iso){return fDate(iso);}
function dateShort(iso){return fDate(iso);}
function dayShort(iso){return new Date(`${iso}T12:00:00`).toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','');}
function sameDay(a,b){return String(a)===String(b);}
function agendaInterval(event){
  return {
    start:agendaDateTime(event.appointment_date,event.start_time),
    end:agendaDateTime(event.end_date||event.appointment_date,event.end_time)
  };
}
function eventsOverlap(a,b){
  const A=agendaInterval(a),B=agendaInterval(b);
  return A.start<B.end && A.end>B.start;
}
function segmentForDay(event,day){
  const startDay=agendaDateTime(day,'00:00');
  const endDay=agendaDateTime(plusDaysFrom(day,1),'00:00');
  const interval=agendaInterval(event);
  const start=interval.start>startDay?interval.start:startDay;
  const end=interval.end<endDay?interval.end:endDay;
  if(end<=start)return null;
  const top=((start-startDay)/60000/30)*AGENDA_SLOT_HEIGHT;
  const height=Math.max(28,((end-start)/60000/30)*AGENDA_SLOT_HEIGHT-2);
  return {...event,_segmentStart:start,_segmentEnd:end,_top:top,_height:height};
}
function layoutSegments(events,day){
  const segments=events.map(e=>segmentForDay(e,day)).filter(Boolean).sort((a,b)=>a._segmentStart-b._segmentStart);
  const final=[];
  let i=0;
  while(i<segments.length){
    const group=[segments[i]];
    let groupEnd=segments[i]._segmentEnd;
    let j=i+1;
    while(j<segments.length && segments[j]._segmentStart<groupEnd){
      group.push(segments[j]);
      if(segments[j]._segmentEnd>groupEnd)groupEnd=segments[j]._segmentEnd;
      j++;
    }
    const laneEnds=[];
    group.forEach(s=>{
      let lane=laneEnds.findIndex(end=>end<=s._segmentStart);
      if(lane<0){lane=laneEnds.length;laneEnds.push(s._segmentEnd);}
      else laneEnds[lane]=s._segmentEnd;
      s._lane=lane;
    });
    const laneCount=Math.max(1,laneEnds.length);
    group.forEach(s=>{s._laneCount=laneCount;final.push(s);});
    i=j;
  }
  return final;
}
function nextSlot(time){
  const index=AGENDA_TIMES.indexOf(time);
  return index===AGENDA_TIMES.length-1?'00:00':AGENDA_TIMES[Math.max(0,index+1)];
}
function appointmentDraft(day,time){
  return {appointment_date:day,start_time:time,end_time:nextSlot(time),appointment_type:'etude_pret',status:'prevu'};
}

function AgendaPage({appointments,setAppointments,clients,me,notify,openForClient,onQuickAppointmentHandled}){

  const responsables=Array.from(new Set((appointments||[]).map(e=>e.responsable_username).filter(Boolean))).sort();
  const filteredEvents=(appointments||[])
    .filter(e=>!filter || `${e.client_prenom||''} ${e.client_nom||''} ${e.responsable_username||''} ${e.title||''} ${e.location||''}`.toLowerCase().includes(filter.toLowerCase()))
    .filter(e=>!responsable || e.responsable_username===responsable)
    .filter(e=>!typeFilter || e.appointment_type===typeFilter)
    .filter(e=>{
      const it=agendaInterval(e);
      return it.start<agendaDateTime(plusDaysFrom(rangeEnd,1),'00:00') && it.end>agendaDateTime(rangeStart,'00:00');

  useEffect(()=>{
    if(modal)return;

  }
  const weekLabel=view==='week'
    ? `${dateShort(rangeStart)} — ${dateShort(rangeEnd)}`
    : dateLong(anchor);
  const activeCount=filteredEvents.filter(e=>e.status!=='annule').length;
  return <div>
    <div className="bvh-topbar">
      <div><small>Registre des rendez-vous</small><h1>Agenda partagé</h1><p style={{color:'#d8bc78',marginTop:4}}>Vue calendrier · 30 minutes · 24 heures sur 24 · relié aux dossiers clients</p></div>
      <Btn color="#8b642c" onClick={()=>openNew({appointment_date:anchor,start_time:'09:00',end_time:'09:30'})}>+ Nouveau rendez-vous</Btn>
    </div>
    <div className="bvh-calendar-panel">
      <div className="bvh-calendar-toolbar">
        <Btn color="#5f4725" onClick={()=>changePeriod(-1)}>←</Btn>
        <Btn color="#5f4725" onClick={()=>setAnchor(agendaToday())}>Aujourd’hui</Btn>
        <Btn color="#5f4725" onClick={()=>changePeriod(1)}>→</Btn>
        <Inp type="date" value={anchor} onChange={e=>{const real=agendaRealIso(e.target.value);if(real)setAnchor(real);}} style={{width:165}}/>
        <span className="bvh-calendar-title">{weekLabel}</span>
        <div className="bvh-view-toggle">
          <button className={view==='week'?'active':''} onClick={()=>setView('week')}>Semaine</button>
          <button className={view==='day'?'active':''} onClick={()=>setView('day')}>Jour</button>
        </div>
        <span style={{color:'#b69b68',fontSize:13}}>{refreshing?'Actualisation…':`${activeCount} rendez-vous`}</span>
        <div className="bvh-calendar-filter"><Inp placeholder="Client, responsable, objet…" value={filter} onChange={e=>setFilter(e.target.value)}/></div>
        <Select label="" value={responsable} onChange={e=>setResponsable(e.target.value)}><option value="">Tous les responsables</option>{responsables.map(x=><option key={x} value={x}>{x}</option>)}</Select>
        <Select label="" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}><option value="">Tous les types</option>{Object.entries(AGENDA_TYPES).map(([k,v])=><option key={k} value={k}>{v}</option>)}</Select>
      </div>
      <div className="bvh-agenda-legend">
        {Object.entries(AGENDA_TYPES).map(([k,label])=><span key={k}><i className="bvh-agenda-dot" style={{background:AGENDA_COLORS[k]}}></i>{label}</span>)}
        <span style={{marginLeft:'auto'}}>Glisse un bloc sur un autre créneau pour déplacer le rendez-vous.</span>
      </div>
      {filteredEvents.length===0&&<div className="bvh-agenda-empty">Aucun rendez-vous dans cette période avec les filtres actuels. Clique sur une case pour en créer un.</div>}
      <div className="bvh-calendar-scroll">
        <div className="bvh-week-grid" style={{'--days':days.length}}>
          <div className="bvh-calendar-corner"></div>
          {days.map(day=><div key={day} className={'bvh-calendar-day-head '+(sameDay(day,agendaToday())?'today':'')} onClick={()=>{setAnchor(day);setView('day')}} title="Ouvrir cette journée">
            <div className="dow">{dayShort(day)}</div><div className="date">{new Date(`${day}T12:00:00`).getDate()}</div>
          </div>)}
          <div>
            {AGENDA_TIMES.map((time,i)=><div className="bvh-calendar-time-label" key={time}>{i%2===0?time:''}</div>)}
          </div>
          {days.map(day=>{
            const segments=layoutSegments(filteredEvents,day);
            const now=new Date(nowTick);
            const isToday=sameDay(day,agendaToday());
            const nowTop=(now.getHours()*2+(now.getMinutes()/30))*AGENDA_SLOT_HEIGHT;
            return <div key={day} className="bvh-calendar-day-column">
              {AGENDA_TIMES.map(time=><div key={time} className="bvh-calendar-slot"
                onClick={()=>openNew(appointmentDraft(day,time))}
                onDragOver={e=>e.preventDefault()}
                onDrop={e=>{e.preventDefault();dropEvent(day,time);}}
                title={`${dateLong(day)} · ${time} — créer un rendez-vous`}
              />)}
              {isToday&&<div className="bvh-calendar-now" style={{top:nowTop}}></div>}
              {segments.map(e=>{
                const color=AGENDA_COLORS[e.appointment_type]||AGENDA_COLORS.autre;
                const left=`calc(${(e._lane/e._laneCount)*100}% + 3px)`;
                const width=`calc(${100/e._laneCount}% - 6px)`;
                const begins=e._segmentStart.getTime()===agendaDateTime(e.appointment_date,e.start_time).getTime();
                const endText=e._segmentEnd.getTime()===agendaDateTime(e.end_date||e.appointment_date,e.end_time).getTime()?e.end_time:'00:00';
                return <button key={`${e.id}-${day}`} draggable
                  className={'bvh-agenda-event '+(e.status==='annule'?'annule':'')}
                  onDragStart={ev=>{setDragged(e);ev.dataTransfer.effectAllowed='move';}}
                  onDragEnd={()=>setDragged(null)}
                  onClick={ev=>{ev.stopPropagation();openEdit(e)}}
                  title={`${e.client_prenom} ${e.client_nom}\n${e.title||AGENDA_TYPES[e.appointment_type]}\n${e.start_time} — ${e.end_time}\nResponsable : ${e.responsable_username||'—'}`}
                  style={{top:e._top+2,height:e._height,left,width,background:`linear-gradient(135deg,${color},${color}bb)`,borderLeftColor:'#f6dfaa',color:'#fff'}}>
                  {begins?<><span className="event-time">{e.start_time} – {endText}</span><span className="event-client">{e.client_prenom} {e.client_nom}</span><span className="event-meta">{e.title||AGENDA_TYPES[e.appointment_type]} · {e.responsable_username||'—'}</span></>:<><span className="event-client">↳ {e.client_prenom} {e.client_nom}</span><span className="event-meta">Suite jusqu’à {endText}</span></>}
                </button>
              })}
            </div>
          })}
        </div>
      </div>
    </div>
    <AgendaModal open={modal} event={editing} initial={draft} clients={clients} me={me} appointments={appointments} onClose={closeModal} onSave={save} onDelete={remove}/>
  </div>
}

function Check({label,checked,onChange}){return <label style={{display:'flex',gap:8,alignItems:'center',color:'#d8bf82',fontWeight:700}}><input type="checkbox" checked={!!checked} onChange={e=>onChange(e.target.checked)}/>{label}</label>}
function horseDiscord(f){
  const coupons=(f.numeros_coupons||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const line=(label,value)=>`**${label} :** ${value??''}`;
  const kept=(items)=>items.filter(item=>item[0]).map(item=>'✅ '+item[1]);
  const paris={gagnant:'Gagnant',place:'Placé',couple:'Couplé',autre:f.type_pari_autre||'Autre'};
  const count=Number(f.coupons_count)||1;
  return [
    '## DOSSIER DE CRÉDIT DE MISE HIPPIQUE ##','',
    '**INFORMATIONS PERSONNELLES**',
    line('Date du jour', f.date_du_jour||''),
    line('Télégramme', f.telegram||''),
    line('Adresse résidentielle actuelle', f.adresse||''),
    line('Profession actuelle', f.profession||''),'',
    '**VÉRIFICATION D’IDENTITÉ**',
    ...kept([
      [f.identite_presentee,'Pièce d’identité valide présentée'],
      [f.photographie_ajoutee,'Photographie du client réalisée et ajoutée au dossier']
    ]),
    line('Lien pièce d’identité', f.piece_identite_url||''),
    line('Lien photographie', f.photographie_url||''),'',
    '**DEMANDE DE CRÉDIT DE MISE**',
    line('Montant total emprunté', `25 $ x ${count} = ${25*count} $`),
    line('Taux d’intérêt fixe', `${f.taux||0} %`),'',
    '**INFORMATIONS SUR LE PARI HIPPIQUE**',
    line('Date de la course', f.date_course||''),
    line('Écurie ou cheval', f.cheval_ecurie||''),
    line('Type de pari', paris[f.type_pari]||f.type_pari||''),
    line('Bookmaker', f.bookmaker||''),'',
    '**COUPONS DE MISE**',
    line('Numéros de série', coupons.length?coupons.map(x=>'N°'+x).join(', '):''),
    ...kept([
      [f.coupons_enregistres,'Coupons enregistrés dans le registre officiel'],
      [f.numeros_verifies,'Vérification des numéros de série effectuée']
    ]),'',
    '**SITUATION FINANCIÈRE**',
    line('Revenus mensuels estimés', f.revenus_mensuels||''),
    line('Patrimoine déclaré', f.patrimoine||''),
    line('Biens en garantie', f.garanties||''),'',
    '**RÉFÉRENCES**',
    line('Recommandé', f.recommande?'Oui':'Non'),
    ...(f.recommande?[line('Référent', f.referent||'')]:[]),
    line('Autres recommandations', f.recommandations||''),'',
    '**DÉCLARATIONS ET ACCEPTATION**',
    ...kept([
      [f.a1,'Les coupons demeurent la propriété de la banque jusqu’à leur utilisation'],
      [f.a2,'Remboursement immédiat après la course'],
      [f.a3,'En cas de gains, remboursement du montant et des intérêts'],
      [f.a4,'Saisie possible des biens en cas de défaut'],
      [f.a5,'Exactitude des informations certifiée'],
      [f.a6,'Conditions générales acceptées']
    ]),'',
    'Le demandeur reconnaît qu’un crédit de mise hippique constitue un engagement financier immédiat et que tout défaut de remboursement pourra entraîner des mesures de recouvrement, des saisies patrimoniales, une procédure judiciaire fédérale ainsi que l’inscription dans les registres officiels des débiteurs insolvables.',
    'Par sa signature, le demandeur atteste avoir pris connaissance de l’ensemble des présentes conditions et les accepter sans réserve.'
  ].join('\n');
}

function HorseCreditPage({clients,notify,activeAgence='toutes',onActiveAgenceChange,focusId,createFor,onLeave,formOnly}){
  const empty={
    id:null,dossier_id:'',client_id:'',client_nom:'',client_prenom:'',telegram:'',adresse:'',profession:'',
    date_du_jour:isoToFr(today()),
    identite_presentee:false,photographie_ajoutee:false,piece_identite_url:'',photographie_url:'',
    coupons_count:1,taux:0,date_course:'',cheval_ecurie:'',type_pari:'gagnant',type_pari_autre:'',
    bookmaker:'',numeros_coupons:'',coupons_enregistres:false,numeros_verifies:false,
    revenus_mensuels:'',patrimoine:'',garanties:'',recommande:false,referent:'',recommandations:'',
    a1:false,a2:false,a3:false,a4:false,a5:false,a6:false,statut:'en_cours'
  };
  const[f,setF]=useState(empty);
  const[credits,setCredits]=useState([]);
  const[busy,setBusy]=useState(false);
  const[view,setView]=useState(null);
  const[agency,setAgency]=useState(activeAgence||'toutes');
  const[formOpen,setFormOpen]=useState(false);
  useEffect(()=>{setAgency(activeAgence||'toutes')},[activeAgence]);

  useEffect(()=>{api.horseCredits().then(setCredits).catch(e=>notify('⚠ '+e.message))},[]);
  useEffect(()=>{if(!focusId)return;const target=(credits||[]).find(c=>String(c.id)===String(focusId));if(target)setView(target);},[focusId,credits]);
  useEffect(()=>{if(!createFor||!createFor.id)return;setF({...empty,client_id:createFor.id,client_nom:createFor.nom||'',client_prenom:createFor.prenom||'',telegram:createFor.telegram||'',adresse:createFor.adresse||'',date_du_jour:isoToFr(today())});setView(null);setFormOpen(true);},[createFor&&createFor.id]);
  function cancelHorseForm(){setFormOpen(false);if((createFor||formOnly)&&onLeave&&!f.id)onLeave();}

  function fromCredit(c){
    const acc=c.acceptations||{};
    return {
      ...empty,
      ...c,
      client_id:c.client_id||'',
      numeros_coupons:Array.isArray(c.numeros_coupons)?c.numeros_coupons.join('\n'):'',
      a1:!!acc.a1,a2:!!acc.a2,a3:!!acc.a3,a4:!!acc.a4,a5:!!acc.a5,a6:!!acc.a6,
      statut:c.statut||'en_cours'
    };
  }

  function payloadFromForm(){
    const discord=horseDiscord(f);
    return {
      ...f,
      numeros_coupons:String(f.numeros_coupons||'').split('\n').map(x=>x.trim()).filter(Boolean),
      acceptations:{a1:f.a1,a2:f.a2,a3:f.a3,a4:f.a4,a5:f.a5,a6:f.a6},
      discord_text:discord,
      agence:agency && agency !== 'toutes' ? agency : (f.agence || '')
    };
  }

  function resetForm(){setF(empty);setView(null);setFormOpen(false);}
  function openNew(){setF({...empty,date_du_jour:isoToFr(today())});setView(null);setFormOpen(true);}
  useEffect(()=>{if(formOnly)openNew();},[formOnly]);
  function pick(id){const c=clients.find(x=>String(x.id)===String(id));setF({...f,client_id:id,client_nom:c?.nom||'',client_prenom:c?.prenom||'',telegram:c?.telegram||'',adresse:c?.adresse||''});}

  async function save(){
    try{
      setBusy(true);
      const payload=payloadFromForm();
      if(!payload.id){
        const linked=await ensureClient({id:f.client_id,prenom:f.client_prenom,nom:f.client_nom,telegram:f.telegram,adresse:f.adresse,profession:f.profession}, clients);
        if(linked.client) payload.client_id=linked.client.id;
      }
      const r=payload.id?await api.updateHorseCredit(payload):await api.addHorseCredit(payload);
      setCredits(payload.id?credits.map(x=>x.id===r.id?r:x):[r,...credits]);
      setF(fromCredit(r));
      setFormOpen(false);
      notify(payload.id?'Crédit hippique modifié':'Crédit hippique enregistré');
      if(formOnly&&onLeave)onLeave();
      else setView(r);
    }catch(e){notify('⚠ '+e.message)}
    finally{setBusy(false)}
  }
  async function remove(c){
    if(!confirm(`Supprimer définitivement le dossier ${c.dossier_id} ?`))return;
    try{
      await api.deleteHorseCredit(c.id);
      setCredits(credits.filter(x=>x.id!==c.id));
      if(view?.id===c.id)setView(null);
      if(f.id===c.id)resetForm();
      notify('Crédit hippique supprimé');
    }catch(e){notify('⚠ '+e.message)}
  }
  function edit(c){setView(null);setF(fromCredit(c));setFormOpen(true);}
  function show(c){setView(c);window.scrollTo({top:0,behavior:'smooth'});}
  function horseCard(c){
    const statut=c.statut||'en_cours';
    const done=statut==='termine';
    return {
      category:statut,
      shell:done?'recouvrement-cloture':'',
      color:statut==='refuse'?'#b94735':done?'#111111':'#c9943c',
      status:statut==='refuse'?'Refusé':done?'Terminé':'En cours',
      ref:c.dossier_id||c.id,
      name:`${c.client_prenom||''} ${c.client_nom||''}`.trim()||'—',
      telegram:c.telegram||'',
      agencyLabel:(c.agence||c.bank_code)?agenceLabel(normalizeAgence(c.agence||c.bank_code)):'',
      left:fCur(c.montant_total), leftLabel:'Mise',
      right:`${c.taux||0} %`, rightLabel:'Taux',
      dueCaption:'Course',
      nextText:c.date_course||'Date non indiquée',
      complete:done,
      doneCaption:'Dossier',
      doneText:'✓ Terminé'
    };
  }

  if(view && window.BF && window.BF.FicheShell){
    const Shell=window.BF.FicheShell, line=window.BF.ficheLine;
    const agencyText=agenceLabel(normalizeAgence(view.agence||view.bank_code||''));
    return <Shell
      reference={view.dossier_id||view.id}
      title={`${view.client_prenom||''} ${view.client_nom||''}`.trim()||'—'}
      telegram={view.telegram}
      agencyLabel={agencyText}
      onBack={()=>{setView(null);if(onLeave&&(focusId||createFor))onLeave();}}
      left={[line('Adresse', view.adresse||'—'), line('Profession', view.profession||'—'), line('Course', view.date_course||'—'), line('Cheval / écurie', view.cheval_ecurie||'—')]}
      right={[line('Mise', fCur(view.montant_total), '#f3d58a'), line('Taux', `${view.taux||0} %`), line('Pari', `${view.type_pari||'—'}${view.type_pari_autre?` · ${view.type_pari_autre}`:''}`), line('Statut', view.statut==='termine'?'Terminé':view.statut==='refuse'?'Refusé':'En cours', view.statut==='termine'?'#74d59d':view.statut==='refuse'?'#d76453':'#f3d58a')]}
      actions={<><Btn color="#8b642c" onClick={()=>edit(view)}>Modifier</Btn><Btn color={C.red} onClick={()=>remove(view)}>Supprimer</Btn></>}
    >
    <div className="bvh-ledger"><div className="bvh-ledger-title">Dossier</div>
      <div style={{padding:16,display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <div className="bvh-field"><b>Bookmaker</b><span>{view.bookmaker||'—'}</span></div>
        <div className="bvh-field"><b>Garanties</b><span>{view.garanties||'—'}</span></div>
        <div className="bvh-field"><b>Pièce d'identité</b><span>{view.piece_identite_url?<a href={view.piece_identite_url} target="_blank" rel="noreferrer" style={{color:'#f3d58a'}}>Consulter</a>:'—'}</span></div>
        <div className="bvh-field"><b>Photographie</b><span>{view.photographie_url?<a href={view.photographie_url} target="_blank" rel="noreferrer" style={{color:'#f3d58a'}}>Consulter</a>:'—'}</span></div>
      </div>
    </div>
    </Shell>;
  }

  return <div>
    {formOpen&&<div onClick={e=>e.target===e.currentTarget&&cancelHorseForm()} style={{position:'fixed',inset:0,background:'#000b',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}><div style={{background:C.card,borderTop:'4px solid '+C.blue,borderRadius:14,padding:24,width:820,maxWidth:'100%',maxHeight:'92vh',overflow:'auto'}}>
      <h2>{f.id?'Modifier le crédit hippique':'Nouveau crédit hippique'}</h2>
      <section className="bvh-form-part"><h3>Client</h3><div className="bvh-form-grid">
          <div className="bvh-form-span"><Select label="Client existant" value={f.client_id} onChange={e=>pick(e.target.value)}><option value="">— Sélectionner —</option>{clients.map(c=><option key={c.id} value={c.id}>{c.prenom} {c.nom}</option>)}</Select></div>
          <Inp label="Prénom" value={f.client_prenom} onChange={e=>setF({...f,client_prenom:e.target.value})}/>
          <Inp label="Nom" value={f.client_nom} onChange={e=>setF({...f,client_nom:e.target.value})}/>
          <Inp label="Date du jour" value={f.date_du_jour} onChange={e=>setF({...f,date_du_jour:e.target.value})}/>
          <Inp label="Télégramme" value={f.telegram} onChange={e=>setF({...f,telegram:e.target.value})}/>
          <div className="bvh-form-span"><Inp label="Adresse résidentielle actuelle" value={f.adresse} onChange={e=>setF({...f,adresse:e.target.value})}/></div>
          <div className="bvh-form-span"><Inp label="Profession actuelle" value={f.profession} onChange={e=>setF({...f,profession:e.target.value})}/></div>
      </div></section>
      <section className="bvh-form-part"><h3>Vérification d'identité</h3><div className="bvh-form-plain">
          <Check label="Pièce d’identité valide présentée" checked={f.identite_presentee} onChange={v=>setF({...f,identite_presentee:v})}/>
          <Check label="Photographie du client réalisée et ajoutée au dossier" checked={f.photographie_ajoutee} onChange={v=>setF({...f,photographie_ajoutee:v})}/>
          <Inp label="Lien pièce d’identité" value={f.piece_identite_url} onChange={e=>setF({...f,piece_identite_url:e.target.value})}/>
          <Inp label="Lien photographie" value={f.photographie_url} onChange={e=>setF({...f,photographie_url:e.target.value})}/>
      </div></section>
      <section className="bvh-form-part"><h3>Demande et course</h3><div className="bvh-form-grid">
          <Inp label="Nombre de coupons" type="number" value={f.coupons_count} onChange={e=>setF({...f,coupons_count:e.target.value})}/>
          <Inp label="Taux fixe (%)" type="number" value={f.taux} onChange={e=>setF({...f,taux:e.target.value})}/>
          <div className="bvh-form-span"><p style={{color:'#f3d58a',margin:0}}>Montant total : <b>{25*(Number(f.coupons_count)||1)} $</b></p></div>
          <Inp label="Date de la course" value={f.date_course} onChange={e=>setF({...f,date_course:e.target.value})}/>
          <Inp label="Écurie ou cheval" value={f.cheval_ecurie} onChange={e=>setF({...f,cheval_ecurie:e.target.value})}/>
          <Select label="Type de pari" value={f.type_pari} onChange={e=>setF({...f,type_pari:e.target.value})}><option value="gagnant">Gagnant</option><option value="place">Placé</option><option value="couple">Couplé</option><option value="autre">Autre</option></Select>
          {f.type_pari==='autre'&&<Inp label="Autre type de pari" value={f.type_pari_autre} onChange={e=>setF({...f,type_pari_autre:e.target.value})}/>}
          <div className="bvh-form-span"><Inp label="Bookmaker partenaire" value={f.bookmaker} onChange={e=>setF({...f,bookmaker:e.target.value})}/></div>
          <div className="bvh-form-span"><Txt label="Numéros de série des coupons — un par ligne" value={f.numeros_coupons} onChange={e=>setF({...f,numeros_coupons:e.target.value})}/></div>
          <div className="bvh-form-span"><Check label="Coupons enregistrés dans le registre officiel" checked={f.coupons_enregistres} onChange={v=>setF({...f,coupons_enregistres:v})}/></div>
          <div className="bvh-form-span"><Check label="Vérification des numéros de série effectuée" checked={f.numeros_verifies} onChange={v=>setF({...f,numeros_verifies:v})}/></div>
      </div></section>
      <section className="bvh-form-part"><h3>Situation financière et références</h3><div className="bvh-form-grid">
          <Inp label="Revenus mensuels estimés" value={f.revenus_mensuels} onChange={e=>setF({...f,revenus_mensuels:e.target.value})}/>
          <Inp label="Patrimoine déclaré" value={f.patrimoine} onChange={e=>setF({...f,patrimoine:e.target.value})}/>
          <div className="bvh-form-span"><Inp label="Biens en garantie" value={f.garanties} onChange={e=>setF({...f,garanties:e.target.value})}/></div>
          <div className="bvh-form-span"><Check label="Recommandé par un employé/client/partenaire" checked={f.recommande} onChange={v=>setF({...f,recommande:v})}/></div>
          <Inp label="Nom du référent" value={f.referent} onChange={e=>setF({...f,referent:e.target.value})}/>
          <div className="bvh-form-span"><Txt label="Autres recommandations" value={f.recommandations} onChange={e=>setF({...f,recommandations:e.target.value})}/></div>
      </div></section>
      <section className="bvh-form-part"><h3>Déclarations</h3><div className="bvh-form-plain">

}

function appointmentTouchesDate(event,date){
  const start=agendaDateTime(event.appointment_date,event.start_time);
  const end=agendaDateTime(event.end_date||event.appointment_date,event.end_time);
  const dayStart=agendaDateTime(date,'00:00');
  const dayEnd=agendaDateTime(plusDaysFrom(date,1),'00:00');
  return start<dayEnd && end>dayStart;
}
function dashboardAppointmentTime(event,date){
  const begins=String(event.appointment_date)===String(date)?event.start_time:'00:00';
  const ends=String(event.end_date||event.appointment_date)===String(date)?event.end_time:'00:00';
  return `${begins} — ${ends}`;
}
function TodayAppointments({appointments=[],onOpenAgenda,onOpenClient}){
  const currentDate=agendaToday();
  const events=(appointments||[])
    .filter(e=>appointmentTouchesDate(e,currentDate))
    .sort((a,b)=>agendaInterval(a).start-agendaInterval(b).start);
  return <div className="bvh-ledger" style={{marginTop:54,marginBottom:14}}>
    <div className="bvh-today-agenda-head">
      <div><b>Rendez-vous du jour</b><span className="bvh-today-agenda-count">{events.length} prévu{events.length===1?'':'s'} · {fDate(currentDate)}</span></div>
      <Btn color="#5f4725" onClick={onOpenAgenda}>Ouvrir l’agenda</Btn>
    </div>
    {events.length===0?<p className="bvh-empty">Aucun rendez-vous prévu aujourd’hui.</p>:events.map(event=>{
      const color=AGENDA_COLORS[event.appointment_type]||'#8b642c';
      const type=AGENDA_TYPES[event.appointment_type]||event.appointment_type||'Rendez-vous';
      return <div className="bvh-today-agenda-row" key={event.id} style={{'--agenda-color':color}}>
        <div className="bvh-today-agenda-time">{dashboardAppointmentTime(event,currentDate)}</div>
        <div><span className="bvh-today-agenda-client">{event.client_prenom} {event.client_nom}</span><span className="bvh-today-agenda-sub">{type}{event.title?` · ${event.title}`:''}</span></div>
        <div className="bvh-today-agenda-responsable"><AgendaStatus status={event.status}/><span>Responsable : {event.responsable_username||'—'}</span></div>
        <div className="bvh-today-agenda-actions"><Btn color="#5f4725" onClick={()=>onOpenClient(event.client_id)}>Dossier</Btn><Btn color={color} onClick={onOpenAgenda}>Agenda</Btn></div>
      </div>
    })}
  </div>
}
function moneyNow(value){
  const number=Number(value);
  if(!Number.isFinite(number)) return 0;
  return Math.round((number+Number.EPSILON)*100)/100;
}
function fundCapitalNow(row){
  if(['clos','paye','solde','anticipe'].includes(row?.status)) return 0;
  const raw=row?.capital_balance!=null && row.capital_balance!=='' ? row.capital_balance : row?.amount;
  return moneyNow(raw);
}
function lifeCapitalNow(row){
  if(['closed','paid_to_beneficiary','cancelled'].includes(row?.status)) return 0;
  return moneyNow(row?.financials&&row.financials.balance);
}
function termCapitalNow(row){
  if(row?.settlement || ['clos','paye','solde','anticipe'].includes(row?.status)) return 0;
  return moneyNow(row?.amount);
}
function investmentOwner(row, clients, mode){
  if(mode==='subscriber'){
    if(row.subscriber_client_id) return (clients||[]).find(c=>String(c.id)===String(row.subscriber_client_id))||null;
    const wanted=personKey(`${row.subscriber_first_name||''} ${row.subscriber_last_name||''}`);
    return wanted ? (clients||[]).find(c=>personKey(`${c.prenom||''} ${c.nom||''}`)===wanted)||null : null;
  }
  if(row.client_id) return (clients||[]).find(c=>String(c.id)===String(row.client_id))||null;
  return (clients||[]).find(c=>rowMatchesClient(c,row))||null;
}
function investmentKey(row, linked, mode){
  if(linked) return String(linked.id);
  if(mode==='subscriber'){
    const id=row.subscriber_client_id;
    if(id) return `id:${id}`;
    return `name:${personKey(`${row.subscriber_first_name||''} ${row.subscriber_last_name||''}`)||row.id}`;
  }
  if(row.client_id) return `id:${row.client_id}`;
  return `name:${personKey(row.full_name||`${row.prenom||''} ${row.nom||''}`)||row.id}`;
}
function investmentName(row, linked, mode){
  if(linked) return clientFullName(linked);
  if(mode==='subscriber') return `${row.subscriber_first_name||''} ${row.subscriber_last_name||''}`.trim()||'Investisseur';
  return row.full_name||`${row.prenom||''} ${row.nom||''}`.trim()||'Investisseur';
}
function investorRanking(sources, clients, agency){
  const groups=new Map();
  const add=(row, capital, kind, mode)=>{
    if(agency && agency!=='toutes' && row.agency!==agency) return;
    if(!(capital>0)) return;
    const linked=investmentOwner(row, clients, mode);
    const key=investmentKey(row, linked, mode);
    const current=groups.get(key)||{key, clientId:linked?linked.id:'', name:investmentName(row, linked, mode), contracts:0, capital:0, counts:{fonds:0,vie:0,terme:0,goldstein:0}};
    current.contracts+=1;
    current.counts[kind]+=1;
    current.capital=moneyNow(current.capital+capital);
    groups.set(key, current);
  };
  (sources.funds||[]).forEach(row=>add(row, fundCapitalNow(row), 'fonds'));
  (sources.life||[]).forEach(row=>add(row, lifeCapitalNow(row), 'vie', 'subscriber'));
  (sources.term||[]).forEach(row=>add(row, termCapitalNow(row), 'terme'));
  (sources.goldstein||[]).forEach(row=>add(row, moneyNow(row.balance), 'goldstein'));
  return [...groups.values()]
    .sort((a,b)=>b.capital-a.capital || a.name.localeCompare(b.name,'fr'))
    .map((row,index)=>({...row, place:index+1}));
}
function investmentDetail(counts){
  const bits=[];
  if(counts.fonds) bits.push(`${counts.fonds} fonds`);
  if(counts.vie) bits.push(counts.vie>1?`${counts.vie} assurances-vie`:'1 assurance-vie');
  if(counts.terme) bits.push(counts.terme>1?`${counts.terme} épargnes`:'1 épargne');
  if(counts.goldstein) bits.push(counts.goldstein>1?`${counts.goldstein} livrets`:'1 livret');
  return bits.join(' · ');
}
function Dashboard({loans,clients,funds=[],lifeInsurance=[],termSavings=[],goldstein=[],activeAgence='toutes',me,onMark,onLoanUpdate,appointments=[],onOpenAgenda,onOpenClient,onOpenLoan,onOpenPage,notify}){
  const[reminderTarget,setReminderTarget]=useState(null);
  const[dueTab,setDueTab]=useState('tous');
  const[allInvestors,setAllInvestors]=useState(false);

  const paidAmountForLoan=l=>(l.echeances||[]).filter(e=>e.statut==='paye').reduce((sum,e)=>sum+Number(e.montant||0),0);
  const remainingForLoan=l=>Math.max(Number(l.total_a_rembourser||0)-paidAmountForLoan(l),0);
  const unpaidForLoan=l=>(l.echeances||[]).filter(e=>e.statut!=='paye').sort((a,b)=>rpIso(a.date).localeCompare(rpIso(b.date)));
  const loanStatus=l=>{
    if(isNeverReimbursed(l))return 'jamais_rembourse';
    if(isLoanRecouvrementCloture(l))return 'clotures';
    if(isLoanInRecouvrement(l))return 'recouvrement';
    const open=unpaidForLoan(l);
    if(open.length===0)return 'clotures';
    if(open.some(e=>st(e)==='retard'))return 'retards';
    if(st(open[0])==='aujourdhui')return 'aujourdhui';

  const totalAttendu=loans.reduce((s,l)=>s+Number(l.total_a_rembourser||0),0);
  const encaisse=loans.reduce((s,l)=>s+paidAmountForLoan(l),0);
  const restant=Math.max(totalAttendu-encaisse,0);
  const statusCounts=Object.keys(statusMeta).reduce((acc,k)=>({...acc,[k]:loans.filter(l=>loanStatus(l)===k).length}),{});
  const tauxCloture=totalLoans?(statusCounts.clotures/totalLoans)*100:0;
  const tauxRemboursement=totalAttendu?(encaisse/totalAttendu)*100:0;

  const donutSegments=['avenir','aujourdhui','retards','recouvrement','clotures','jamais_rembourse'].map(k=>({...statusMeta[k],key:k,count:statusCounts[k]||0}));
  let cursor=0;
  const donutGradient=totalLoans
    ? `conic-gradient(${donutSegments.map(s=>{const start=cursor;cursor+=(s.count/totalLoans)*100;return `${s.color} ${start}% ${cursor}%`;}).join(',')})`
    : 'conic-gradient(#333 0% 100%)';

  const agencyKeys=['van_horn','saint_denis','rhodes','valentine','blackwater','strawberry','sunset'];
  const agencyStats=agencyKeys.map(key=>{
    const list=loans.filter(l=>loanAgence(l)===key);
    const total=list.length;
    const paid=list.reduce((s,l)=>s+paidAmountForLoan(l),0);
    const expected=list.reduce((s,l)=>s+Number(l.total_a_rembourser||0),0);
    const closed=list.filter(l=>loanStatus(l)==='clotures').length;
    const late=list.filter(l=>loanStatus(l)==='retards').length;
    const recovery=list.filter(l=>loanStatus(l)==='recouvrement').length;
    const active=list.filter(l=>!['clotures'].includes(loanStatus(l))).length;
    const recoveryRate=expected?(paid/expected)*100:0;
    const closeRate=total?(closed/total)*100:0;
    const score=Math.max(0,Math.min(100,Math.round((recoveryRate*.55+closeRate*.45)-(late*4)-(recovery*5)+10)));
    return {key,label:agenceLabel(key),list,total,paid,expected,closed,late,recovery,active,recoveryRate,closeRate,score};
  }).filter(b=>b.total>0||loans.length===0);

  const maxPaid=Math.max(1,...agencyStats.map(b=>b.paid));
  const maxClosed=Math.max(1,...agencyStats.map(b=>b.closed));

  const days30=Array.from({length:8},(_,i)=>{
    const iso=plusDays(-(7-i)*4);
    const amount=loans.reduce((sum,l)=>sum+(l.echeances||[]).filter(e=>e.statut==='paye'&&String(e.date||'')<=iso).reduce((a,e)=>a+Number(e.montant||0),0),0);
    return {iso,amount};
  });
  const maxLine=Math.max(1,...days30.map(d=>d.amount));
  const linePoints=days30.map((d,i)=>{
    const x=(i/(days30.length-1))*100;
    const y=100-(d.amount/maxLine)*86-7;
    return `${x},${y}`;
  }).join(' ');

  const upcoming=[];
  loans.forEach(l=>{
    const status=loanStatus(l);
    if(status==='clotures'||status==='recouvrement')return;
    (l.echeances||[]).forEach((e,i)=>{
      if(e.statut!=='paye'){
        const d=daysDiff(e.date);
        if(d<=7)upcoming.push({...e,loan:l,i,d});
      }

  upcoming.sort((a,b)=>rpIso(a.date).localeCompare(rpIso(b.date)));

  const alerts=[
    ...upcoming.filter(e=>e.d<0).slice(0,3).map(e=>({icon:'⚠️',title:`${e.loan.prenom} ${e.loan.nom}`,sub:`Échéance du ${fDate(e.date)}`,tag:'Retard',color:'#b94735',right:`${Math.abs(e.d)} j`})),
    ...loans.filter(l=>loanStatus(l)==='recouvrement').slice(0,3).map(l=>({icon:'⚖️',title:l.loan_id,sub:`${l.prenom} ${l.nom}`,tag:'Recouvrement',color:'#8f58b3',right:'En cours'})),
    ...upcoming.filter(e=>e.d>=0).slice(0,3).map(e=>({icon:'⏱️',title:`${e.loan.prenom} ${e.loan.nom}`,sub:`Échéance ${fDate(e.date)}`,tag:'À traiter',color:'#8b642c',right:e.d===0?"Aujourd’hui":`${e.d} j`}))

    (l.echeances||[]).forEach((e,i)=>{if(e.statut!=='paye')liveRows.push({...e,loan:l,i,d:daysDiff(e.date)});});

  liveRows.sort((a,b)=>rpIso(a.date).localeCompare(rpIso(b.date)));
  const shownRows=liveRows.filter(e=>dueTab==='tous'||(dueTab==='retard'?e.d<0:e.d>=0)).slice(0,8);
  const ranked=[...agencyStats].sort((a,b)=>b.score-a.score);
  const investors=investorRanking({funds,life:lifeInsurance,term:termSavings,goldstein}, clients, activeAgence);

  return <div className="vx-home">

      <div><small>Registre bancaire · {date1904()}</small><h1>Banque Fédérale</h1><p style={{color:'#d8bc78',marginTop:4}}>Choisis un client pour retrouver ses prêts, son épargne et ses autres contrats. {me?.username} · {roleLabel(me)}</p></div>

        <button type="button" className="vx-btn primary" onClick={()=>onOpenPage?.('clients')}>Choisir un client</button>
      </div>
    </div>

      <div><b>{fCur(capitalPrete)}</b><span>Capital prêté</span></div>
      <div><b>{clients.length}</b><span>Clients</span></div>
      <div><b>{totalLoans-statusCounts.clotures}</b><span>Prêts ouverts</span></div>
      <div><b>{statusCounts.retards}</b><span>Retards</span></div>
    </div>

    <section className="vx-section">
      <div className="vx-head">
        <div><h2>Agences ouvertes</h2><p className="vx-lead" style={{textAlign:'left',margin:0}}>Volume encaissé, dossiers et score de chaque comptoir.</p></div>
      </div>
      <div className="vx-grid">
        {ranked.slice(0,6).map(b=><article className="vx-card" key={b.key}>
          <header><span>{b.label}</span><span>{b.total} dossiers</span></header>
          <h3>{fCur(b.paid)}</h3>
          <p>{b.active} ouverts · {b.late} retards · {b.recovery} recouvrements</p>
          <div className="vx-bar"><i style={{width:Math.max(6,b.score)+'%'}}></i></div>
        </article>)}
      </div>
    </section>

    <section className="vx-section">
      <h2>Résultats des prêts</h2>

        </article>

          <header><span>Recouvrement</span><span>{statusCounts.clotures} clôturés</span></header>

  </div>

const SERVICE_BANKS=['saint_denis','van_horn','valentine','rhodes','blackwater','strawberry','sunset'];
function serviceBankList(row){
  if(Array.isArray(row?.agencies)&&row.agencies.length){
    return [...new Set(row.agencies.map(value=>String(value||'').trim()).filter(Boolean).map(value=>normalizeAgence(value)))];
  }
  const raw=row?.agency||row?.agence||row?.bank_code||'';
  return String(raw).trim()?[normalizeAgence(raw)]:[];
}
function loanIsClosed(loan){
  if(isNeverReimbursed(loan)) return false;
  if(isLoanRecouvrementCloture(loan)) return true;
  return (loan.echeances||[]).every(e=>e.statut==='paye');
}
function loanPaidNow(loan){
  return (loan.echeances||[]).filter(e=>e.statut==='paye').reduce((sum,e)=>sum+Number(e.montant||0),0);
}
function bump(bucket, key, patch){
  const slot=bucket[key]||{};
  Object.entries(patch).forEach(([name,value])=>{slot[name]=(slot[name]||0)+Number(value||0);});
  bucket[key]=slot;
}
function serviceBoard(title, note, columns, rows, assign, create){
  const banks={};
  const total={};
  SERVICE_BANKS.forEach(key=>{banks[key]={};});
  rows.forEach(row=>{
    const patch=assign(row);
    const keys=patch.banks&&patch.banks.length?patch.banks:[''];
    bump(total, 'all', patch.values);
    keys.forEach(key=>bump(banks, key, patch.values));
  });
  const extra=Object.keys(banks).filter(key=>key&&!SERVICE_BANKS.includes(key));
  return {title, note, columns, banks, extra, total:total.all||{}, create};
}
function copyText(text){
  const value=String(text==null?'':text);
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(value);
  return new Promise((resolve,reject)=>{
    try{
      const area=document.createElement('textarea');
      area.value=value;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';
      document.body.appendChild(area);area.select();
      const ok=document.execCommand('copy');
      document.body.removeChild(area);
      ok?resolve():reject(new Error('copie impossible'));
    }catch(e){reject(e)}
  });
}

      ['dossiers','Dossiers',false],['open','Ouverts',false],['late','Retards',false],['lent','Prêté',true],['paid','Encaissé',true],['left','Restant',true]

      const closed=loanIsClosed(loan);

      const paid=loanPaidNow(loan);

  const[me,setMe]=useState(null),[loading,setLoading]=useState(true),[page,setPage]=useState('dashboard'),[footerPage,setFooterPage]=useState(null),[toast,setToast]=useState(''),[loans,setLoans]=useState([]),[clients,setClients]=useState([]),[appointments,setAppointments]=useState([]),[lifeInsurance,setLifeInsurance]=useState([]),[books,setBooks]=useState({}),[horses,setHorses]=useState([]),[users,setUsers]=useState([]),[logs,setLogs]=useState([]),[menuOpen,setMenuOpen]=useState(false),[refreshing,setRefreshing]=useState(false),[loanDraftActive,setLoanDraftActive]=useState(false),[clientFocus,setClientFocus]=useState(null),[loanPrefill,setLoanPrefill]=useState(null),[loanFocus,setLoanFocus]=useState(null),[agendaPrefill,setAgendaPrefill]=useState(null),[activeAgence,setActiveAgence]=useState('toutes');

  async function mark(loan,i,val){const es=[...(loan.echeances||[])];es[i]={...es[i],statut:val?'paye':'attente'};const allPaid=es.length>0&&es.every(e=>e.statut==='paye');const patch={id:loan.id,echeances:es};if(allPaid)patch.recouvrement_status='cloture';else if((loan.recouvrement_status||'')==='cloture')patch.recouvrement_status='aucun';try{const u=await api.updateLoan(patch);setLoans(loans.map(x=>x.id===u.id?u:x));notify(allPaid?'Paiement validé · prêt clôturé automatiquement':val?'Paiement validé':'Paiement annulé')}catch(e){notify('⚠ '+e.message)}}

nActiveAgenceChange={setActiveAgence}/>} {page==='gage'&&window.BF&&<window.BF.ServiceDesk service="pawn_loans" clients={clients} notify={notify} activeAgence={activeAgence} onActiveAgenceChange={setActiveAgence}/>} {page==='consigne'&&window.BF&&<window.BF.ServiceDesk service="consigne_contracts" clients={clients} notify={notify} activeAgence={activeAgence} onActiveAgenceChange={setActiveAgence}/>} {page==='terme'&&window.BF&&<window.BF.ServiceDesk service="term_savings" clients={clients} notify={notify} activeAgence={activeAgence} onActiveAgenceChange={setActiveAgence}/>} {page==='paie'&&window.BF&&<window.BF.ServiceDesk service="payroll_contracts" clients={clients} notify={notify} activeAgence={activeAgence} onActiveAgenceChange={setActiveAgence}/>} {page==='goldstein'&&window.BF&&<window.BF.ServiceDesk service="goldstein_booklets" clients={clients} notify={notify} activeAgence={activeAgence} onActiveAgenceChange={setActiveAgence}/>} {page==='salaires'&&canOpenDirection(me)&&<SalaryPage notify={notify}/>} {page==='users'&&canOpenDirection(me)&&<UserPanel me={me} users={users} setUsers={setUsers} notify={notify}/>} {page==='logs'&&canOpenDirection(me)&&<LogsPage logs={logs}/>}
